name: email-delivery CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.2", "8.3", "8.4", "8.5" ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: email_delivery_test
          MYSQL_ROOT_PASSWORD: fixture-email-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pfixture-email-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      EMAIL_DELIVERY_IT_DSN: "mysql:host=127.0.0.1;port=3306;dbname=email_delivery_test;charset=utf8mb4"
      EMAIL_DELIVERY_IT_USER: root
      EMAIL_DELIVERY_IT_PASS: fixture-email-only
      EMAIL_DELIVERY_IT_REQUIRED: "1"

    steps:
      # -------------------------------------------------
      # 1) Checkout
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 2) Setup PHP
      # -------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, mbstring, openssl, zip
          ini-values: memory_limit=512M

      # -------------------------------------------------
      # 3) Validate composer.json
      # -------------------------------------------------
      - name: Validate composer.json
        run: composer validate --strict

      # -------------------------------------------------
      # 4) Install dependencies
      # -------------------------------------------------
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # -------------------------------------------------
      # 5) Dump optimized autoload
      # -------------------------------------------------
      - name: Optimize autoload
        run: composer dump-autoload --optimize

      # -------------------------------------------------
      # 6) Run PHPUnit (Unit Tests)
      # -------------------------------------------------
      - name: Verify safe skips without a database configuration
        run: env -u EMAIL_DELIVERY_IT_DSN -u EMAIL_DELIVERY_IT_REQUIRED composer test

      - name: Run PHPUnit including required real MySQL tests
        run: composer test

      # -------------------------------------------------
      # 7) Run PHPStan (Level Max)
      # -------------------------------------------------
      - name: Run PHPStan
        run: composer analyse

      - name: Validate consumer documentation and API inventory
        run: composer check:docs

      - name: Smoke-check safe consumer examples
        run: composer check:examples

      # -------------------------------------------------
      # 8) Syntax Check (extra safety)
      # -------------------------------------------------
      - name: Lint PHP files
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l
  release-artifact:
    name: Release Artifact Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer
          coverage: none
          extensions: zip, mbstring, openssl
      - name: Validate manifest
        run: composer validate --strict
      - name: Inspect actual Git and Composer archives and production autoload
        run: composer check:artifact
        env:
          EMAIL_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/email-release-evidence
      - name: Retain exact target, candidate SHA and archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-release-artifact-${{ github.sha }}
          path: |
            ${{ runner.temp }}/email-release-evidence/*.json
            ${{ runner.temp }}/email-release-evidence/*.log
            ${{ runner.temp }}/email-release-evidence/qualified-artifact/artifact-verification.json
            ${{ runner.temp }}/email-release-evidence/qualified-artifact/*.log
          if-no-files-found: error
          retention-days: 30
      - name: Retain verified archives only after successful verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: email-release-archives-${{ github.sha }}
          path: |
            ${{ runner.temp }}/email-release-evidence/*-candidate.zip
            ${{ runner.temp }}/email-release-evidence/qualified-artifact/*-candidate.zip
          if-no-files-found: error
          retention-days: 30

  ci-gate:
    name: CI Gate
    if: always()
    needs: [quality, release-artifact]
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates on this exact workflow SHA
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          ARTIFACT_RESULT: ${{ needs.release-artifact.result }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$ARTIFACT_RESULT" = success
          echo "Quality and artifact gates passed for workflow SHA $CANDIDATE_SHA. Read the artifact mode: published-target checks preserve the original qualified tag and do not qualify this live SHA for retagging."
