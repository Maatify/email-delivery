<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 565" width="960" height="565" role="img" aria-labelledby="title desc">
  <title id="title">Email queue acceptance and delivery</title>
  <desc id="desc">Legacy inserts per call; keyed writes queue and durable receipt atomically. Worker claims then commits before SMTP. Acceptance does not prove mailbox delivery.</desc>
  <defs>
    <style>
.bg{fill:#fff}.node{fill:#f4f7fa;stroke:#456274;stroke-width:1.7}.store{fill:none;stroke:#4e8cae;stroke-width:1.5;stroke-dasharray:6 4}.warn{fill:#fff4dc;stroke:#a07320;stroke-width:1.5}.label{font-family:sans-serif;font-size:15px;font-weight:600;fill:#152d3b;text-anchor:middle}.sub{font-family:sans-serif;font-size:12px;fill:#374f5d;text-anchor:middle}.arrow{fill:none;stroke:#456274;stroke-width:1.7;marker-end:url(#arrow)}.note{fill:none;stroke:#a07320;stroke-width:1.5;stroke-dasharray:5 4}
@media(prefers-color-scheme:dark){.bg{fill:#101820}.node{fill:#1b2c38;stroke:#8eb0c4}.label{fill:#eef5fa}.sub{fill:#c4d5df}.warn{fill:#372d1b;stroke:#b8954b}.arrow{stroke:#8eb0c4}}
</style>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0 0L8 3.5L0 7Z" fill="#65869b" />
    </marker>
  </defs>
  <rect class="bg" width="960" height="565" />
  <rect class="node" x="330" y="20" width="300" height="60" rx="7" />
  <text class="label" x="480.0" y="44">Application</text>
  <text class="sub" x="480.0" y="64">Caller owns intent and authentication</text>
  <path class="arrow" d="M480 80 L480 95 L195 95 L195 120" />
  <path class="arrow" d="M480 95 L765 95 L765 120" />
  <rect class="node" x="60" y="120" width="270" height="60" rx="7" />
  <text class="label" x="195.0" y="144">Legacy void writer</text>
  <text class="sub" x="195.0" y="164">One insert per call</text>
  <rect class="node" x="630" y="120" width="270" height="60" rx="7" />
  <text class="label" x="765.0" y="144">Keyed writer</text>
  <text class="sub" x="765.0" y="164">Explicit namespace + stable key</text>
  <rect class="store" x="295" y="230" width="640" height="150" rx="10" />
  <text class="sub" x="615" y="251">Keyed acceptance commits both stores atomically</text>
  <rect class="node" x="325" y="275" width="310" height="70" rx="7" />
  <text class="label" x="480.0" y="299">cd_email_queue</text>
  <text class="sub" x="480.0" y="319">Encrypted recipient / template context</text>
  <text class="sub" x="480.0" y="335">Mutable processing state</text>
  <rect class="node" x="660" y="275" width="250" height="70" rx="7" />
  <text class="label" x="785.0" y="299">Durable receipts</text>
  <text class="sub" x="785.0" y="319">Encrypted digest + job binding</text>
  <text class="sub" x="785.0" y="335">Retained after queue purge</text>
  <path class="arrow" d="M195 180 L195 310 L325 310" />
  <path class="arrow" d="M765 180 L765 210 L480 210 L480 275" />
  <path class="arrow" d="M765 210 L785 210 L785 275" />
  <path class="arrow" d="M480 345 L480 420" />
  <rect class="node" x="325" y="420" width="310" height="75" rx="7" />
  <text class="label" x="480.0" y="444">Worker: claim, then commit</text>
  <text class="sub" x="480.0" y="464">Decrypt / render / attempt transport</text>
  <text class="sub" x="480.0" y="480">UTC keyed; local legacy</text>
  <path class="arrow" d="M635 457 L680 457" />
  <rect class="node" x="680" y="420" width="250" height="75" rx="7" />
  <text class="label" x="805.0" y="444">SMTP transport</text>
  <text class="sub" x="805.0" y="464">Returned call is not mailbox proof</text>
  <text class="sub" x="805.0" y="480">Retries may send again</text>
  <text class="sub" x="480" y="540">Queue acceptance is not exactly-once SMTP. No automatic processing reclaimer.</text>
</svg>
