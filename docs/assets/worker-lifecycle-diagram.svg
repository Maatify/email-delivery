<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 735" width="1000" height="735" role="img" aria-labelledby="title desc">
  <title id="title">Worker lifecycle and clock boundaries</title>
  <desc id="desc">A pending claim commits before transport. Interruptions can leave processing without automatic recovery. Handled failures retry under fixed tables until attempt four; keyed clocks use database UTC and legacy clocks remain local.</desc>
  <defs>
    <style>
.bg{fill:#fff}.node{fill:#f4f7fa;stroke:#456274;stroke-width:1.7}.store{fill:none;stroke:#4e8cae;stroke-width:1.5;stroke-dasharray:6 4}.warn{fill:#fff4dc;stroke:#a07320;stroke-width:1.5}.label{font-family:sans-serif;font-size:15px;font-weight:600;fill:#152d3b;text-anchor:middle}.sub{font-family:sans-serif;font-size:12px;fill:#374f5d;text-anchor:middle}.arrow{fill:none;stroke:#456274;stroke-width:1.7;marker-end:url(#arrow)}.note{fill:none;stroke:#a07320;stroke-width:1.5;stroke-dasharray:5 4}
@media(prefers-color-scheme:dark){.bg{fill:#101820}.node{fill:#1b2c38;stroke:#8eb0c4}.label{fill:#eef5fa}.sub{fill:#c4d5df}.warn{fill:#372d1b;stroke:#b8954b}.arrow{stroke:#8eb0c4}}
</style>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0 0L8 3.5L0 7Z" fill="#65869b" />
    </marker>
  </defs>
  <rect class="bg" width="1000" height="735" />
  <rect class="node" x="325" y="20" width="310" height="60" rx="7" />
  <text class="label" x="480.0" y="44">Begin batch; discover columns</text>
  <text class="sub" x="480.0" y="64">No cache; no timezone mutation</text>
  <rect class="node" x="325" y="125" width="310" height="70" rx="7" />
  <text class="label" x="480.0" y="149">Lock due pending rows</text>
  <text class="sub" x="480.0" y="169">UTC for keyed; NOW() for legacy</text>
  <text class="sub" x="480.0" y="185">Priority / ID order and batch limit</text>
  <path class="arrow" d="M480 80 L480 125" />
  <path class="arrow" d="M480 195 L480 240" />
  <rect class="node" x="325" y="240" width="310" height="70" rx="7" />
  <text class="label" x="480.0" y="264">Claim and COMMIT</text>
  <text class="sub" x="480.0" y="284">processing; attempts incremented</text>
  <text class="sub" x="480.0" y="300">External work starts after commit</text>
  <rect class="warn" x="40" y="230" width="235" height="100" rx="7" />
  <text class="label" x="157.5" y="254">Interruption here</text>
  <text class="sub" x="157.5" y="274">May leave processing indefinitely</text>
  <text class="sub" x="157.5" y="290">No automatic reclaim/reset</text>
  <path class="note" d="M325 275 L275 275" />
  <path class="arrow" d="M480 310 L480 350" />
  <rect class="node" x="325" y="350" width="310" height="70" rx="7" />
  <text class="label" x="480.0" y="374">Decrypt / decode / render</text>
  <text class="sub" x="480.0" y="394">HTML + subject; attempt transport</text>
  <path class="arrow" d="M480 420 L480 445 L175 445 L175 485" />
  <path class="arrow" d="M480 445 L790 445 L790 485" />
  <rect class="node" x="50" y="485" width="250" height="70" rx="7" />
  <text class="label" x="175.0" y="509">Transport returned: sent</text>
  <text class="sub" x="175.0" y="529">Not a mailbox/read receipt</text>
  <rect class="node" x="655" y="485" width="270" height="70" rx="7" />
  <text class="label" x="790.0" y="509">Handled row failure</text>
  <text class="sub" x="790.0" y="529">SMTP/default backoff tables</text>
  <path class="arrow" d="M790 555 L790 580 L650 580 L650 610" />
  <path class="arrow" d="M790 580 L880 580 L880 610" />
  <rect class="node" x="535" y="610" width="230" height="65" rx="7" />
  <text class="label" x="650.0" y="634">Attempts &lt; 4</text>
  <text class="sub" x="650.0" y="654">pending + retry deadline</text>
  <rect class="node" x="800" y="610" width="160" height="65" rx="7" />
  <text class="label" x="880.0" y="634">Attempts &gt;= 4</text>
  <text class="sub" x="880.0" y="654">failed</text>
  <text class="sub" x="480" y="710">DB/transaction errors may escape. No promise of exactly-once external delivery.</text>
</svg>
