<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .bg { fill: transparent; }
      .box { fill: #F5F5F5; stroke: #333; stroke-width: 2; rx: 4; }
      .decision { fill: #Fdf6e3; stroke: #e6c27a; stroke-width: 2; rx: 20; }
      .text { fill: #333; font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .label { fill: #555; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .arrow { stroke: #555; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }

      @media (prefers-color-scheme: dark) {
        .box { fill: #222; stroke: #ddd; }
        .decision { fill: #3e2723; stroke: #795548; }
        .text { fill: #ddd; }
        .label { fill: #aaa; }
        .arrow { stroke: #aaa; }
      }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="context-stroke" />
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="600" height="700" />

  <!-- Process Steps -->
  <rect class="box" x="225" y="20" width="150" height="40" />
  <text class="text" x="300" y="40">Poll Queue</text>

  <rect class="box" x="225" y="90" width="150" height="40" />
  <text class="text" x="300" y="110">Fetch Pending Job</text>

  <rect class="box" x="225" y="160" width="150" height="40" />
  <text class="text" x="300" y="180">Decrypt Data</text>

  <rect class="box" x="225" y="230" width="150" height="40" />
  <text class="text" x="300" y="250">Decode Payload</text>

  <rect class="box" x="225" y="300" width="150" height="40" />
  <text class="text" x="300" y="320">Render Email</text>

  <rect class="box" x="225" y="370" width="150" height="40" />
  <text class="text" x="300" y="390">Send Email</text>

  <!-- Decision Point 1 -->
  <rect class="decision" x="225" y="440" width="150" height="40" />
  <text class="text" x="300" y="460">Success?</text>

  <!-- Yes Branch -->
  <rect class="box" x="75" y="510" width="120" height="40" />
  <text class="text" x="135" y="530">Mark Sent</text>

  <!-- No Branch (Decision 2) -->
  <rect class="decision" x="375" y="510" width="150" height="40" />
  <text class="text" x="450" y="530">Retry Logic</text>

  <!-- Retry Logic Outcomes -->
  <rect class="box" x="280" y="600" width="150" height="40" />
  <text class="text" x="355" y="620">schedule retry</text>

  <rect class="box" x="450" y="600" width="130" height="40" />
  <text class="text" x="515" y="620">mark failed</text>

  <!-- Connections -->
  <path class="arrow" d="M 300 60 L 300 85" />
  <path class="arrow" d="M 300 130 L 300 155" />
  <path class="arrow" d="M 300 200 L 300 225" />
  <path class="arrow" d="M 300 270 L 300 295" />
  <path class="arrow" d="M 300 340 L 300 365" />
  <path class="arrow" d="M 300 410 L 300 435" />

  <!-- Decision Branches -->
  <path class="arrow" d="M 225 460 L 135 460 L 135 500" />
  <text class="label" x="180" y="450">YES</text>

  <path class="arrow" d="M 375 460 L 450 460 L 450 500" />
  <text class="label" x="415" y="450">NO</text>

  <!-- Attempts Decision Branches -->
  <path class="arrow" d="M 450 550 L 450 570 L 355 570 L 355 590" />
  <text class="label" x="390" y="565">attempts &lt; max</text>

  <path class="arrow" d="M 450 550 L 450 570 L 515 570 L 515 590" />
  <text class="label" x="525" y="565">attempts &gt;= max</text>

  <!-- Back to Poll Queue from Mark Sent and Schedule Retry -->
  <path class="arrow" d="M 135 550 L 135 670 L 30 670 L 30 40 L 215 40" stroke-dasharray="4" />
  <path class="arrow" d="M 355 640 L 355 680 L 15 680 L 15 30 L 215 30" stroke-dasharray="4" />

</svg>
